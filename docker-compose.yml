# Сервер Заң KZ + PostgreSQL одной командой:  docker compose up --build
# Пароли берутся из файла .env (он не отправляется на GitHub). Образец — .env.example

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: zankz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в файле .env}
    volumes:
      - zankz-data:/var/lib/postgresql/data   # данные сохраняются после перезапуска
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zankz"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy   # сервер стартует, когда база уже готова
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/zankz
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_GEMINI_KEY: ${GEMINI_KEY:-}             # ключ Gemini для ИИ-инструментов
      APP_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    ports:
      - "8080:8080"

volumes:
  zankz-data: